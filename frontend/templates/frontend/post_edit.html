{% extends 'frontend/base.html' %}

{% block content %}
<div class="card">
    <div class="card-content">
        <h1 style="text-align:center;">Редактировать пост</h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <label><strong>Название поста</strong></label>
            {{ form.title }}
            <small id="title-counter">0 / 100 символов</small>

            <label><strong>Текст поста</strong></label>
            {{ form.text }}

            <label><strong>Изображение</strong></label>
            {{ form.image }}

            {% if post.image %}
                <div style="margin-top:15px;">
                    <p><strong>Текущее изображение:</strong></p>
                    <img src="{{ post.image.url }}" style="max-width:100%; max-height:330px; object-fit:cover; border-radius:14px;">
                </div>
            {% endif %}

            <div id="preview-container" style="display:none; margin-top:15px;">
                <p><strong>Новое изображение:</strong></p>
                <img id="image-preview" style="max-width:100%; max-height:330px; object-fit:cover; border-radius:14px;">
            </div>

            <div style="margin-top:20px;">
                <button type="submit">Сохранить</button>
                <a href="{% url 'post_detail' post.id %}">
                    <button type="button" class="secondary">Отмена</button>
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    const titleInput = document.getElementById("id_title");
    const counter = document.getElementById("title-counter");

    if (titleInput && counter) {
        counter.textContent = titleInput.value.length + " / 100 символов";

        titleInput.addEventListener("input", function () {
            counter.textContent = titleInput.value.length + " / 100 символов";
        });
    }

    const imageInput = document.getElementById("id_image");
    const previewContainer = document.getElementById("preview-container");
    const imagePreview = document.getElementById("image-preview");

    if (imageInput) {
        imageInput.addEventListener("change", function () {
            const file = imageInput.files[0];

            if (file) {
                const reader = new FileReader();

                reader.onload = function (event) {
                    imagePreview.src = event.target.result;
                    previewContainer.style.display = "block";
                };

                reader.readAsDataURL(file);
            }
        });
    }
</script>
{% endblock %}
